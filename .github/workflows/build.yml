name: Build & Release

on:
  push:
    branches:
      - liveupdate       # every commit updates the rolling "Latest Build" release
    tags:
      - 'v*'             # version tags cut a permanent versioned release
  workflow_dispatch:

jobs:
  build:
    # Pinned to 2022 (VS 17): windows-latest ships VS 18, which the older
    # node-gyp@9.4.1 used by cap/electron-rebuild cannot detect.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp@9.4.1 (via cap/electron-rebuild) uses distutils, which was
      # removed in Python 3.12. Pin to 3.11 so the native build works.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The `cap` native module bundles its own WinPcap SDK (deps/winpcap),
      # so no external Npcap SDK is needed to compile on Windows.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      # --publish never: electron-builder only builds artifacts; the dedicated
      # release job below attaches them, so we avoid double-publishing.
      - name: Build Windows app
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PacketBracket-win
          path: dist-electron/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # action-gh-release needs write access to create the release + move tags;
    # the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Version tags -> permanent release at that tag.
      # Branch pushes  -> a single rolling release re-pointed to the new commit.
      - name: Determine release target
        id: rel
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=rolling" >> "$GITHUB_OUTPUT"
            echo "name=Latest Build" >> "$GITHUB_OUTPUT"
            echo "notes=false" >> "$GITHUB_OUTPUT"
            # Force-move the rolling tag to this commit so the release shows the
            # right source (action-gh-release won't move an existing tag).
            git tag -f rolling
            git push -f origin rolling
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**
          generate_release_notes: ${{ steps.rel.outputs.notes }}
          prerelease: false
          make_latest: true
          body: ${{ github.ref_type == 'tag' && '' || 'Automated build of the latest commit on liveupdate.' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
