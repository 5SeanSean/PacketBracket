name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Pinned to 2022 (VS 17): windows-latest ships VS 18, which the older
    # node-gyp@9.4.1 used by cap/electron-rebuild cannot detect.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp@9.4.1 (via cap/electron-rebuild) uses distutils, which was
      # removed in Python 3.12. Pin to 3.11 so the native build works.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The `cap` native module bundles its own WinPcap SDK (deps/winpcap),
      # so no external Npcap SDK is needed to compile on Windows.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      # --publish never: electron-builder only builds artifacts; the dedicated
      # release job below attaches them, so we avoid double-publishing.
      - name: Build Windows app
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PacketBracket-win
          path: dist-electron/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # action-gh-release needs write access to create the release + notes;
    # the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
