name: Build & Release

on:
  push:
    branches:
      - liveupdate       # every commit updates the rolling "Latest Build" release
    tags:
      - 'v*'             # version tags cut a permanent versioned release
  workflow_dispatch:

jobs:
  build:
    # Pinned to 2022 (VS 17): windows-latest ships VS 18, which the older
    # node-gyp@9.4.1 used by cap/electron-rebuild cannot detect.
    runs-on: windows-2022
    # electron-builder needs write access to create the release + upload the
    # auto-update feed (latest.yml) when publishing a tagged version.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-gyp@9.4.1 (via cap/electron-rebuild) uses distutils, which was
      # removed in Python 3.12. Pin to 3.11 so the native build works.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The `cap` native module bundles its own WinPcap SDK (deps/winpcap),
      # so no external Npcap SDK is needed to compile on Windows.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      # Tag push -> electron-builder publishes the versioned release itself,
      # including the auto-update metadata (latest.yml + .blockmap) that
      # electron-updater reads. GH_TOKEN authorizes the upload.
      - name: Build & publish tagged release
        if: github.ref_type == 'tag'
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch push -> build artifacts only; the rolling-release job below
      # attaches them for manual download (no auto-update feed on rolling).
      - name: Build Windows app
        if: github.ref_type != 'tag'
        run: npm run build:win -- --publish never

      - name: Upload artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PacketBracket-win
          path: dist-electron/*.exe
          if-no-files-found: error

  # Rolling "Latest Build" release for branch pushes only. Tagged releases are
  # published directly by electron-builder in the build job above.
  release:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    # action-gh-release needs write access to create the release + move tags;
    # the default GITHUB_TOKEN is read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Move rolling tag to this commit
        shell: bash
        run: |
          # Force-move the rolling tag to this commit so the release shows the
          # right source (action-gh-release won't move an existing tag).
          git tag -f rolling
          git push -f origin rolling

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: Latest Build
          target_commitish: ${{ github.sha }}
          files: artifacts/**
          generate_release_notes: false
          prerelease: false
          make_latest: false
          body: 'Automated build of the latest commit on liveupdate.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
